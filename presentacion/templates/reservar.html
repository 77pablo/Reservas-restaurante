
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservar mesa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
            color: #222;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input, textarea, button {
            box-sizing: border-box;
            width: 100%;
            margin-top: 7px;
            padding: 11px;
            font-size: 16px;
        }

        button {
            margin-top: 24px;
            background: #245c45;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #245c45;
        }
    </style>
</head>
<body>
    <h1>Reservar una mesa</h1>
    <p>Utiliza los datos de tu cuenta de cliente registrada.</p>

    <form method="POST" action="{{ url_for('reservar') }}">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="nombre_completo">Nombre completo</label>
        <input
            type="text"
            id="nombre_completo"
            name="nombre_completo"
            maxlength="150"
            autocomplete="name"
            required
        >

        <label for="correo_electronico">Correo electrónico</label>
        <input
            type="email"
            id="correo_electronico"
            name="correo_electronico"
            maxlength="100"
            autocomplete="email"
            required
        >

        <label for="fecha">Fecha de la reserva</label>
        <input
            type="date"
            id="fecha"
            name="fecha"
            min="{{ fecha_minima }}"
            required
        >

        <label for="cantidad_personas">Cantidad de personas</label>
        <input
            type="number"
            id="cantidad_personas"
            name="cantidad_personas"
            min="1"
            max="30"
            value="2"
            required
        >

        <label for="hora_inicio">Hora de inicio</label>
        <input
            type="time"
            id="hora_inicio"
            name="hora_inicio"
            required
        >

        <label for="hora_fin">Hora de término</label>
        <input
            type="time"
            id="hora_fin"
            name="hora_fin"
            required
        >

        <label for="observaciones">Observaciones (opcional)</label>
        <textarea
            id="observaciones"
            name="observaciones"
            rows="4"
            placeholder="Preferencias u otras indicaciones"
        ></textarea>

        <button type="submit">Confirmar reserva</button>
    </form>

    <p><a href="/">Volver al inicio</a></p>
</body>
</html>


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas Restaurante</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ed;
            color: #26352d;
        }

        header {
            background: #263b30;
            color: white;
            padding: 24px 8%;
        }

        main {
            max-width: 900px;
            margin: 60px auto;
            padding: 24px;
        }

        section {
            background: white;
            padding: 40px;
            border-radius: 16px;
        }

        .boton {
            display: inline-block;
            padding: 12px 18px;
            margin: 8px 8px 0 0;
            border-radius: 8px;
            background: #344f3f;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Reservas Restaurante</h1>
    </header>

    <main>
        <section>
            <h2>Bienvenido a nuestro restaurante</h2>
            <p>
                Estamos preparando nuestro sistema para consultar
                disponibilidad y reservar mesas en línea.
            </p>

            <a class="boton" href="/reservar">Reservar una mesa</a>
            <a class="boton" href="/reservas">Administración</a>
        </section>
    </main>
</body>
</html>
